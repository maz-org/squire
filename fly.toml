app = "squire"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[deploy]
release_command = "node scripts/db-migrate.ts"

[env]
NODE_ENV = "production"
PORT = "8080"
HOST = "0.0.0.0"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]
idle_timeout = 600

[[http_service.checks]]
grace_period = "30s"
interval = "15s"
method = "GET"
timeout = "2s"
path = "/api/live"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
