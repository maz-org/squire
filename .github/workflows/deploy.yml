name: Deploy to Fly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy maz-squire
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://squire.maz.org
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Verify Fly deploy token is configured
        run: test -n "$FLY_API_TOKEN"

      - name: Wait for production rule-source reindex when retrieval changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          changed="$(
            gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" \
              --jq '.files[].filename'
          )"
          if ! printf '%s\n' "$changed" | grep -Eq '^(data/pdfs/|data/rule-sources/|src/index-docs\.ts$|src/vector-store\.ts$|src/embedder\.ts$|src/retrieval-source\.ts$)'; then
            echo "No production rule-source reindex needed for this deploy."
            exit 0
          fi

          echo "Retrieval/indexing files changed; waiting for production reindex workflow for $HEAD_SHA."
          run_id=""
          for _ in {1..30}; do
            run_id="$(
              gh run list \
                --workflow production-reindex-pdfs.yml \
                --branch main \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
                | head -n 1
            )"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Production reindex workflow did not start for retrieval/indexing changes."
            exit 1
          fi

          gh run watch "$run_id" --exit-status --interval 30

      - name: Deploy to Fly
        run: flyctl deploy -a maz-squire --remote-only --env SENTRY_RELEASE="$SENTRY_RELEASE"

      - name: Show Fly status
        run: flyctl status -a maz-squire

      - name: Smoke production health
        run: node scripts/check-deploy-health.ts --base-url https://maz-squire.fly.dev
