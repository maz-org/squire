name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres + pgvector service container so integration tests can run
    # against a real DB. Required from SQR-32 onward — every issue in the
    # Storage & Data Migration project depends on this.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: squire
          POSTGRES_PASSWORD: squire
          POSTGRES_DB: squire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squire -d squire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # CI intentionally points both DATABASE_URL and TEST_DATABASE_URL at the
    # same database — there's only one pgvector service container and no
    # "dev vs test" distinction at CI time. Do not split these.
    env:
      DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test
      TEST_DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # CSS build step removed with SQR-71 (ADR 0011): `/app.css` is now
      # compiled in-process at request time via @tailwindcss/node, so no
      # pre-build step exists or is needed. Vitest exercises the full
      # compile path in the test suite.

      - name: Run database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ test/ scripts/

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint markdown
        run: npm run lint:md

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_name="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -sSLo "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${archive_name}"
          if command -v gh >/dev/null 2>&1; then
            gh attestation verify --repo rhysd/actionlint "$archive_path"
          else
            checksums_path="$RUNNER_TEMP/actionlint_checksums.txt"
            curl -sSLo "$checksums_path" \
              "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_checksums.txt"
            expected_sha="$(grep "  ${archive_name}$" "$checksums_path" | cut -d ' ' -f 1)"
            actual_sha="$(sha256sum "$archive_path" | cut -d ' ' -f 1)"
            test -n "$expected_sha"
            test "$actual_sha" = "$expected_sha"
          fi
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions
        run: actionlint

      - name: Format check
        run: npx prettier --check src/ test/

      - name: Test with coverage
        run: npm run test:coverage

  slow-pdf-extraction:
    name: Slow PDF extraction test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: squire
          POSTGRES_PASSWORD: squire
          POSTGRES_DB: squire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squire -d squire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test
      TEST_DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Slow PDF extraction test
        run: npm run test:slow:pdf

  authenticated-api-agent-e2e:
    name: Authenticated API and agent E2E smoke
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: squire
          POSTGRES_PASSWORD: squire
          POSTGRES_DB: squire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squire -d squire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test
      TEST_DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      NODE_ENV: development
      SQUIRE_ENV: e2e
      SESSION_SECRET: ci-e2e-session-secret-32-characters-minimum
      GOOGLE_OAUTH_CLIENT_ID: ci-e2e-unused-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-e2e-unused-google-client-secret
      SQUIRE_ALLOWED_EMAILS: ci-e2e@squire.local
      SQUIRE_LLM_DAILY_BUDGET_USD: '0.25'
      PORT: '3000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Index rule sources
        run: npm run index

      - name: Seed card and scenario data
        run: npm run seed

      - name: Authenticated API and agent E2E smoke
        run: npm run e2e:api-agent

  browser-e2e:
    name: Browser E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: squire
          POSTGRES_PASSWORD: squire
          POSTGRES_DB: squire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squire -d squire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test
      TEST_DATABASE_URL: postgres://squire:squire@localhost:5432/squire_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E smoke
        run: npm run e2e:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
