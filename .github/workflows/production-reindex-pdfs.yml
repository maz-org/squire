name: Production reindex PDFs

on:
  push:
    branches: [main]
    paths:
      - 'data/pdfs/**'
      - 'src/index-docs.ts'
      - 'src/vector-store.ts'
      - 'src/embedder.ts'
      - 'src/retrieval-source.ts'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Truncate and rebuild all PDF embeddings before indexing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-reindex-pdfs
  cancel-in-progress: false

jobs:
  reindex-pdfs:
    name: Reindex production PDFs
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://squire.maz.org
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      NODE_ENV: production
      SQUIRE_ENV: production

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Verify production database target
        run: npm run production-data:verify-db-url

      - name: Run production migrations
        run: npm run db:migrate

      - name: Truncate embeddings for rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild
        run: npm run production-data:truncate-embeddings

      - name: Index PDFs
        run: npm run index

      - name: Sanity check embeddings
        run: npm run production-data:check -- embeddings
