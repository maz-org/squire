name: Production reindex rule sources

on:
  push:
    branches: [main]
    paths:
      - 'data/pdfs/**'
      - 'data/rule-sources/**'
      - 'src/index-docs.ts'
      - 'src/vector-store.ts'
      - 'src/embedder.ts'
      - 'src/retrieval-source.ts'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Truncate and rebuild the selected rule-source embeddings before indexing'
        required: false
        type: boolean
        default: false
      game:
        description: 'Game rule sources to index'
        required: false
        type: choice
        default: all
        options:
          - all
          - frosthaven
          - gloomhaven-2e

permissions:
  contents: read

concurrency:
  group: production-reindex-pdfs
  cancel-in-progress: false

jobs:
  reindex-rule-sources:
    name: Reindex production rule sources
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://squire.maz.org
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      NODE_ENV: production
      SQUIRE_ENV: production
      SQUIRE_DATA_GAME: ${{ github.event.inputs.game || 'all' }}
      SQUIRE_INDEX_GAME: ${{ github.event.inputs.game || 'all' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - run: npm ci

      - name: Verify production database target
        run: npm run production-data:verify-db-url

      - name: Start Fly Postgres proxy
        shell: bash
        run: |
          remote_host="$(node -e 'console.log(new URL(process.env.PRODUCTION_DATABASE_URL).hostname)')"
          proxied_url="$(node -e 'const url = new URL(process.env.PRODUCTION_DATABASE_URL); url.hostname = "127.0.0.1"; url.port = "15432"; console.log(url.toString())')"
          echo "::add-mask::$proxied_url"
          echo "DATABASE_URL=$proxied_url" >> "$GITHUB_ENV"
          flyctl wireguard websockets enable
          flyctl proxy 15432:5432 "$remote_host" --app maz-squire > /tmp/fly-postgres-proxy.log 2>&1 &
          echo "$!" > /tmp/fly-postgres-proxy.pid
          for _ in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/15432) >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/fly-postgres-proxy.pid)" 2>/dev/null; then
              cat /tmp/fly-postgres-proxy.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/fly-postgres-proxy.log
          exit 1

      - name: Run production migrations
        run: npm run db:migrate

      - name: Truncate embeddings for rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild
        run: npm run production-data:truncate-embeddings

      - name: Index rule sources
        run: npm run index

      - name: Sanity check embeddings
        run: npm run production-data:check -- embeddings --game "$SQUIRE_DATA_GAME"

      - name: Smoke check production retrieval
        run: npm run production-data:smoke -- --game "$SQUIRE_DATA_GAME"

      - name: Stop Fly Postgres proxy
        if: always()
        run: kill "$(cat /tmp/fly-postgres-proxy.pid)" 2>/dev/null || true
